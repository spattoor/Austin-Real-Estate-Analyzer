name: Refresh Austin market snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * 1'
permissions:
  contents: read
concurrency:
  group: austin-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_REFRESH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            deploy/requirements.txt
            requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - name: Build snapshot through the five Prefect stages
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: 'false'
        run: python -m portfolio.refresh
      - name: Test pipeline, AI boundary, restoration, and dashboard
        run: python -m unittest discover -s tests -p test_portfolio.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: austin-market-snapshot
          path: deploy/data/austin.db
          retention-days: 14
      - name: Obtain short-lived AWS credentials
        if: vars.AWS_ROLE_ARN != '' && vars.AUSTIN_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Publish immutable raw data and snapshot, then latest pointer
        if: vars.AWS_ROLE_ARN != '' && vars.AUSTIN_S3_BUCKET != ''
        env:
          AUSTIN_S3_BUCKET: ${{ vars.AUSTIN_S3_BUCKET }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from portfolio.snapshot import publish
          print(publish(Path('deploy/data/austin.db'), Path('data/raw/portfolio/zillow_zhvi.csv')))
          PY
